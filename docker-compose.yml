services:
  db:
    image: postgres:16
    container_name: stockflow_db
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - stockflow_pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: stockflow_test_db
    environment:
      POSTGRES_DB: stockflow_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  stockflow_pgdata: